<svg width="100%" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Anvil256 logo</title>
<desc>An anvil silhouette with keccak hash sparks and the Anvil256 wordmark</desc>
<style>
.wm-title { font-family: 'Courier New', monospace; font-weight: 700; font-size: 52px; fill: #c87a1c; letter-spacing: -1px; }
.wm-sub   { font-family: 'Courier New', monospace; font-weight: 400; font-size: 15px; fill: #a06010; letter-spacing: 3px; }
.hash-txt { font-family: 'Courier New', monospace; font-size: 10px; fill: #c87a1c; opacity: 0.45; }
@media (prefers-color-scheme: dark) {
  .wm-title { fill: #ffc77a; }
  .wm-sub   { fill: #c87a1c; }
  .hash-txt { fill: #ffc77a; opacity: 0.3; }
}
</style>
<polygon points="60,74 100,50 140,50 140,74" fill="#c87a1c"/>
<rect x="60" y="74" width="200" height="52" rx="4" fill="#c87a1c"/>
<polygon points="80,126 240,126 228,142 92,142" fill="#9a6010"/>
<rect x="72" y="142" width="176" height="28" rx="4" fill="#7a4a08"/>
<line x1="68" y1="80" x2="252" y2="80" stroke="#e8981c" stroke-width="2" opacity="0.5"/>
<circle cx="170" cy="42" r="2.5" fill="#ffc77a" opacity="0.9"/>
<circle cx="152" cy="32" r="1.5" fill="#ffd89a" opacity="0.7"/>
<circle cx="186" cy="28" r="2"   fill="#ffc77a" opacity="0.8"/>
<circle cx="200" cy="40" r="1.5" fill="#e8981c" opacity="0.6"/>
<circle cx="140" cy="44" r="1"   fill="#ffd89a" opacity="0.5"/>
<circle cx="210" cy="32" r="2"   fill="#ffc77a" opacity="0.7"/>
<line x1="170" y1="48" x2="164" y2="36" stroke="#ffc77a" stroke-width="1" opacity="0.5"/>
<line x1="186" y1="48" x2="193" y2="30" stroke="#ffd89a" stroke-width="1" opacity="0.5"/>
<text class="wm-title" x="292" y="118">ANVIL<tspan fill="#ffc77a">256</tspan></text>
<text class="wm-sub" x="294" y="146">KECCAK-256</text>
<line x1="294" y1="154" x2="638" y2="154" stroke="#c87a1c" stroke-width="0.75" opacity="0.4"/>
</svg>
