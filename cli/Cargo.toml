[package]
name         = "anvil256-cli"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.78"
description  = "Anvil256 reference mining client — Rust orchestrator that drives the C++/CUDA kernel."
license      = "MIT"
authors      = ["Anvil256 contributors"]
repository   = "https://github.com/anvil256/anvil256"
readme       = "../README.md"

[[bin]]
name = "anvil256-cli"
path = "src/main.rs"

[dependencies]
ethers           = { version = "2.0", default-features = false, features = ["rustls", "abigen", "ws"] }
tokio            = { version = "1",   features = ["full"] }
clap             = { version = "4",   features = ["derive", "env"] }
dotenvy          = "0.15"
serde            = { version = "1",   features = ["derive"] }
serde_json       = "1"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow           = "1"
thiserror        = "1"
hex              = "0.4"
url              = "2"

[profile.release]
lto              = "fat"
codegen-units    = 1
strip            = "symbols"
opt-level        = 3
panic            = "abort"
overflow-checks  = true

[profile.dev]
overflow-checks  = true
